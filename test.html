<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>IceDogs Portal — Supabase Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --icedogs-red: #C8102E; --icedogs-black: #000000; --ios-bg: #F8F8F8;
    --ios-card: #FFFFFF; --ios-green: #34C759; --ios-sep: #E5E5E5; --ios-text: #1C1C1E;
    --std-logo-size: 40px; --muted-text: #888;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background-color: var(--ios-bg); color: var(--ios-text); margin: 0; padding: 0; }
  .main-container { padding: 16px; max-width: 450px; margin: 0 auto; }
  .card { background: var(--ios-card); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--ios-sep); }
  .team-logo { width: var(--std-logo-size); height: var(--std-logo-size); object-fit: contain; flex-shrink: 0; }
  .main-portal-logo { width: 70px; height: auto; display: block; margin: 0 auto 15px auto; }
  .btn-primary { background: var(--icedogs-red); color: white; border: none; width: 100%; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  input, select { width: 100%; height: 52px; background: white; border: 2px solid var(--ios-sep); padding: 0 16px; border-radius: 12px; font-size: 16px; margin-bottom: 12px; font-family: inherit; }
  .empty-state { padding: 30px; text-align: center; color: #888; font-style: italic; font-size: 14px; background: #fdfdfd; }
  #timerCont { background: var(--ios-card); border: 1px solid var(--ios-sep); border-radius: 8px; padding: 8px; margin: 15px; text-align: center; }
  .timer-header { font-weight: 900; font-size: 9px; color: var(--icedogs-red); margin-bottom: 4px; letter-spacing: 0.5px; }
  .timer-grid { display: flex; justify-content: center; align-items: center; gap: 4px; }
  .timer-slot { display: flex; flex-direction: column; align-items: center; min-width: 35px; }
  .timer-val { font-size: 18px; font-weight: 900; color: var(--ios-text); line-height: 1; }
  .timer-sep { font-size: 16px; font-weight: 900; color: var(--ios-sep); }
  .timer-label { font-size: 7px; font-weight: 800; color: var(--muted-text); text-transform: uppercase; margin-top: 2px; }
  .live-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--icedogs-red); color: white; font-size: 11px; font-weight: 900; padding: 6px 12px; border-radius: 20px; }
  .list-item { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--ios-sep); }
  .result-badge { font-size: 12px; font-weight: 900; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .result-W { background: #15803d; color: white; }
  .result-L { background: #991b1b; color: white; }
  .result-T { background: #475569; color: white; }
  .result-upcoming { background: var(--ios-sep); color: var(--muted-text); font-size: 10px; }
  .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #D1D1D1; transition: .3s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--ios-green); }
  input:checked + .slider:before { transform: translateX(22px); }
</style>
</head>
<body>

<div class="main-container" id="mainContainer">
  <div id="userStatusBar" style="display:none; background:#000; color:white; padding:12px 16px; border-radius:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
    <div>🏒 <span id="barUserName"></span></div>
    <button onclick="signOut()" style="background:none; border:1px solid #444; border-radius:20px; color:#ccc; font-size:10px; font-weight:800; padding:4px 10px; cursor:pointer;">Sign Out</button>
  </div>

  <div id="loginSection">
    <div class="card">
      <div id="loginLogoCont"></div>
      <div style="font-size:18px; font-weight:900; margin-bottom:20px; text-align:center; text-transform:uppercase;">Off-Ice Officials Portal</div>
      <select id="userPicker" onchange="handleUserSelect()"><option value="">Select Your Name...</option></select>
      <div id="pinArea" style="display:none; margin-top:10px;">
        <input type="password" id="userPin" placeholder="PIN" inputmode="numeric" maxlength="4" style="text-align:center;">
        <button id="loginBtn" class="btn-primary" onclick="attemptLogin()">Login</button>
      </div>
      <div id="loginError" style="display:none; color:#C8102E; font-size:12px; font-weight:700; text-align:center; margin-top:8px;"></div>
    </div>
    <div id="loginBroadcastNotice" style="display:none;"></div>
    <div class="card" style="border-top:4px solid var(--icedogs-red); padding:0; overflow:hidden;">
      <div style="font-weight:900; font-size:14px; padding:15px; text-align:center; border-bottom:1px solid var(--ios-sep);">UPCOMING HOME GAMES</div>
      <div id="publicGamesList"></div>
    </div>
  </div>

  <div id="appSection" style="display:none;">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:15px; font-weight:900;" id="appUserName"></div>
        <div style="font-size:11px; color:var(--muted-text);">Role: <span id="appUserRole"></span></div>
      </div>
    </div>

    <div style="display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap;">
      <button id="tabBtnAvail" onclick="switchAppTab('avail')" style="flex:1; height:40px; border:none; border-radius:10px; background:var(--icedogs-red); color:white; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">Avail</button>
      <button id="tabBtnMyGames" onclick="switchAppTab('myGames')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">My Games</button>
      <button id="tabBtnCrew" onclick="switchAppTab('crew')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">Crew</button>
      <button id="tabBtnSeason" onclick="switchAppTab('season')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">Season</button>
      <button id="tabBtnProfile" onclick="switchAppTab('profile')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">Profile</button>
      <button id="tabBtnAdmin" onclick="switchAppTab('admin')" style="display:none; flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:9px; cursor:pointer; text-transform:uppercase;">Admin</button>
    </div>

    <div id="appTabAdmin" style="display:none;">
      <div class="card">
        <div style="font-weight:900; font-size:14px; margin-bottom:6px;">🔐 SECURITY</div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px; background:var(--ios-bg); border-radius:10px; border:1px solid var(--ios-sep);">
          <div style="font-weight:800; font-size:13px;">Require PIN on Login</div>
          <label class="switch"><input type="checkbox" id="pinToggle" onchange="updatePinRequirement(this.checked)"><span class="slider"></span></label>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:900; font-size:14px; margin-bottom:6px;">📅 AVAILABILITY WINDOWS</div>
        <div id="monthToggleList"></div>
      </div>

      <div class="card">
        <div style="font-weight:900; font-size:14px; margin-bottom:6px;">📢 BROADCAST MESSAGE</div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <button onclick="setBroadcastType('reminder')" id="bTypeReminder" style="flex:1; padding:7px 0; border-radius:8px; border:2px solid #f59e0b; background:#b45309; color:white; font-size:10px; font-weight:900; cursor:pointer;">⏰ Reminder</button>
          <button onclick="setBroadcastType('info')" id="bTypeInfo" style="flex:1; padding:7px 0; border-radius:8px; border:2px solid #60a5fa; background:#1d4ed8; color:white; font-size:10px; font-weight:900; cursor:pointer; opacity:0.45;">ℹ️ Info</button>
          <button onclick="setBroadcastType('urgent')" id="bTypeUrgent" style="flex:1; padding:7px 0; border-radius:8px; border:2px solid #ff4060; background:#C8102E; color:white; font-size:10px; font-weight:900; cursor:pointer; opacity:0.45;">⚠️ Urgent</button>
        </div>
        <textarea id="broadcastText" rows="3" placeholder="Type your message..." style="width:100%; border-radius:8px; border:1px solid var(--ios-sep); padding:10px 12px; font-size:13px; font-family:inherit; resize:none; box-sizing:border-box;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px; align-items:flex-end;">
          <div style="flex:1;">
            <div style="font-size:10px; font-weight:800; color:var(--muted-text); margin-bottom:4px;">Expires (optional)</div>
            <input type="date" id="broadcastExpiry" style="width:100%; height:36px; margin:0; box-sizing:border-box;">
          </div>
          <button onclick="sendBroadcastMsg()" style="height:36px; background:var(--icedogs-red); border:none; border-radius:8px; color:white; font-size:13px; font-weight:900; padding:0 18px; cursor:pointer;">Send →</button>
        </div>
        <div id="broadcastMsg" style="display:none; font-size:12px; font-weight:700; margin-top:8px;"></div>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:12px 14px; border-bottom:1px solid var(--ios-sep); font-weight:900; font-size:13px;">ACTIVE BROADCASTS</div>
        <div id="activeBroadcastList"></div>
      </div>
    </div>

    <div id="appTabProfile" style="display:none;">
      <div id="profileCont"></div>
    </div>

    <div id="appTabSeason" style="display:none;">
      <div id="seasonCont"></div>
    </div>

    <div id="appTabCrew" style="display:none;">
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="font-weight:900; font-size:14px; padding:15px; border-bottom:1px solid var(--ios-sep);">CREW ASSIGNMENTS</div>
        <div id="crewList"></div>
      </div>
    </div>

    <div id="appTabAvail">
      <div class="card">
        <div style="font-weight:900; font-size:14px; margin-bottom:12px;">AVAILABILITY</div>
        <select id="availMonthSelect" onchange="loadAvailGames()"><option value="">Select Month...</option></select>
        <div id="availGameList"></div>
        <button id="availSaveBtn" class="btn-primary" style="display:none; margin-top:16px;" onclick="submitAvailability()">Submit Schedule</button>
        <div id="availMsg" style="display:none; font-size:12px; font-weight:700; text-align:center; margin-top:10px;"></div>
      </div>
    </div>

    <div id="appTabMyGames" style="display:none;">
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="font-weight:900; font-size:14px; padding:15px; border-bottom:1px solid var(--ios-sep);">MY GAMES</div>
        <div id="myGamesList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- Supabase config ----
  const SUPABASE_URL = "https://fcehtovermlilpvwcksl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZWh0b3Zlcm1saWxwdndja3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTQzMDQsImV4cCI6MjEwMTQzMDMwNH0.Gllg9p2j3Bxrv1bpyNFBQMQtYQfWXDcxF9H7njyBksU";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let countdownTimer;

  const LOGIN_FUNCTION_URL = "https://fcehtovermlilpvwcksl.supabase.co/functions/v1/login";
  let pinRequired = false;
  let sessionToken = null;
  let sessionOfficial = null;

  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearLoginError() {
    document.getElementById('loginError').style.display = 'none';
  }

  function handleUserSelect() {
    clearLoginError();
    const user = document.getElementById("userPicker").value;
    document.getElementById("pinArea").style.display = "none";
    if (!user) return;
    if (pinRequired) {
      document.getElementById("pinArea").style.display = "block";
    } else {
      performLogin(user, null);
    }
  }

  function attemptLogin() {
    const user = document.getElementById("userPicker").value;
    const pin = document.getElementById("userPin").value;
    performLogin(user, pin);
  }

  async function performLogin(name, pin) {
    clearLoginError();
    try {
      const res = await fetch(LOGIN_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ name, pin })
      });
      const data = await res.json();
      if (!data.success) {
        showLoginError(data.msg || "Login failed");
        return;
      }
      sessionToken = data.token;
      sessionOfficial = data.official;
      loginSuccess();
    } catch (e) {
      showLoginError("Network error — try again");
    }
  }

  function loginSuccess() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    document.getElementById("userStatusBar").style.display = "flex";
    document.getElementById("barUserName").textContent = sessionOfficial.name;
    document.getElementById("appUserName").textContent = sessionOfficial.name;
    document.getElementById("appUserRole").textContent = sessionOfficial.role;
    if (sessionOfficial.role === 'Admin') {
      document.getElementById('tabBtnAdmin').style.display = 'block';
    }
    loadAvailMonths();
  }

  function switchAppTab(tab) {
    document.getElementById('appTabAvail').style.display = tab === 'avail' ? 'block' : 'none';
    document.getElementById('appTabMyGames').style.display = tab === 'myGames' ? 'block' : 'none';
    document.getElementById('appTabCrew').style.display = tab === 'crew' ? 'block' : 'none';
    document.getElementById('appTabSeason').style.display = tab === 'season' ? 'block' : 'none';
    document.getElementById('appTabProfile').style.display = tab === 'profile' ? 'block' : 'none';
    document.getElementById('appTabAdmin').style.display = tab === 'admin' ? 'block' : 'none';
    ['Avail', 'MyGames', 'Crew', 'Season', 'Profile', 'Admin'].forEach(t => {
      const btn = document.getElementById('tabBtn' + t);
      const key = t.charAt(0).toLowerCase() + t.slice(1);
      const active = key === tab;
      btn.style.background = active ? 'var(--icedogs-red)' : '#e5e5e5';
      btn.style.color = active ? 'white' : '#555';
    });
    if (tab === 'myGames') loadMyGames();
    if (tab === 'crew') loadCrew();
    if (tab === 'season') loadSeason();
    if (tab === 'profile') loadProfile();
    if (tab === 'admin') loadAdmin();
  }

  const ADMIN_ACTION_URL = "https://fcehtovermlilpvwcksl.supabase.co/functions/v1/admin-action";
  let broadcastType = 'reminder';

  async function callAdminAction(action, payload) {
    const res = await fetch(ADMIN_ACTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ token: sessionToken, action, payload })
    });
    return res.json();
  }

  async function loadAdmin() {
    const { data: setting } = await sb.from('app_settings').select('value').eq('key', 'pin_required').maybeSingle();
    document.getElementById('pinToggle').checked = setting && setting.value === 'ON';

    const { data: months } = await sb.from('month_windows').select('month, status').order('month');
    const monthCont = document.getElementById('monthToggleList');
    monthCont.innerHTML = (months || []).map(m => {
      const label = new Date(m.month + "T12:00:00").toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const isActive = m.status === 'Active';
      return '<div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--ios-sep);">'
        + '<span style="font-size:13px; font-weight:700;">' + label + '</span>'
        + '<label class="switch"><input type="checkbox" ' + (isActive ? 'checked' : '') + ' onchange="toggleMonth(\'' + m.month + '\', this.checked)"><span class="slider"></span></label></div>';
    }).join('');

    loadActiveBroadcasts();
  }

  async function updatePinRequirement(checked) {
    const res = await callAdminAction('toggle_pin', { value: checked ? 'ON' : 'OFF' });
    if (!res.success) { alert(res.msg || 'Failed to update'); loadAdmin(); }
  }

  async function toggleMonth(month, checked) {
    const res = await callAdminAction('toggle_month', { month, status: checked ? 'Active' : 'Hidden' });
    if (!res.success) { alert(res.msg || 'Failed to update'); loadAdmin(); }
  }

  function setBroadcastType(type) {
    broadcastType = type;
    ['reminder', 'info', 'urgent'].forEach(t => {
      document.getElementById('bType' + t.charAt(0).toUpperCase() + t.slice(1)).style.opacity = t === type ? '1' : '0.45';
    });
  }

  async function sendBroadcastMsg() {
    const message = document.getElementById('broadcastText').value.trim();
    const expiresAt = document.getElementById('broadcastExpiry').value || null;
    const msgEl = document.getElementById('broadcastMsg');
    if (!message) { msgEl.style.display = 'block'; msgEl.style.color = '#C8102E'; msgEl.textContent = 'Enter a message first'; return; }
    msgEl.style.display = 'block'; msgEl.style.color = 'var(--muted-text)'; msgEl.textContent = 'Sending...';
    const res = await callAdminAction('send_broadcast', { message, type: broadcastType, expiresAt });
    if (res.success) {
      msgEl.style.color = '#166534'; msgEl.textContent = '✓ Broadcast sent!';
      document.getElementById('broadcastText').value = '';
      document.getElementById('broadcastExpiry').value = '';
      loadActiveBroadcasts();
    } else {
      msgEl.style.color = '#C8102E'; msgEl.textContent = res.msg || 'Failed to send';
    }
  }

  async function loadActiveBroadcasts() {
    const { data: broadcasts } = await sb.from('broadcasts').select('id, message, type, sent_at').eq('active', true).order('sent_at', { ascending: false });
    const cont = document.getElementById('activeBroadcastList');
    if (!broadcasts || !broadcasts.length) {
      cont.innerHTML = '<div style="padding:14px; text-align:center; font-size:12px; color:var(--muted-text);">No active broadcasts</div>';
      return;
    }
    cont.innerHTML = broadcasts.map(b => {
      const dateLabel = new Date(b.sent_at).toLocaleDateString();
      return '<div style="display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-bottom:1px solid var(--ios-sep);">'
        + '<div style="flex:1; min-width:0;"><div style="font-size:11px; font-weight:900; color:var(--icedogs-red); text-transform:uppercase;">' + esc(b.type) + '</div>'
        + '<div style="font-size:12px; margin-top:2px;">' + esc(b.message) + '</div>'
        + '<div style="font-size:10px; color:var(--muted-text); margin-top:2px;">' + dateLabel + '</div></div>'
        + '<button onclick="deactivateBroadcast(\'' + b.id + '\')" style="background:#f1f5f9; border:none; border-radius:6px; padding:6px 10px; font-size:11px; font-weight:700; color:#475569; cursor:pointer; white-space:nowrap; margin-left:8px;">Remove</button></div>';
    }).join('');
  }

  async function deactivateBroadcast(id) {
    const res = await callAdminAction('deactivate_broadcast', { id });
    if (res.success) loadActiveBroadcasts();
    else alert(res.msg || 'Failed to remove');
  }

  async function loadProfile() {
    const cont = document.getElementById('profileCont');
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted-text); font-size:13px;">Loading...</div>';

    const { data: me } = await sb.from('officials').select('name, email, phone, address, pass_pref, profile_complete').eq('id', sessionOfficial.id).maybeSingle();
    const { data: admins } = await sb.from('officials').select('name, email').eq('role', 'Admin').order('name');

    const initial = (me.name || '?').charAt(0).toUpperCase();
    let html = '<div class="card">'
      + '<div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">'
      + '<div style="width:40px; height:40px; border-radius:50%; background:var(--icedogs-red); color:white; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px;">' + initial + '</div>'
      + '<div><div style="font-weight:900; font-size:15px;">' + esc(me.name) + '</div><div style="font-size:11px; color:#888;">Profile on file</div></div></div>'
      + '<div style="border-radius:12px; overflow:hidden; border:1px solid var(--ios-sep); margin-bottom:16px;">'
      + profileRow('Email', me.email)
      + profileRow('Phone', me.phone)
      + profileRow('Address', me.address)
      + profileRow('Pass Pref', me.pass_pref, true)
      + '</div>';

    if (me.profile_complete) {
      html += '<div style="background:#fff8ed; border:1px solid #f59e0b; border-radius:12px; padding:14px 16px; margin-bottom:16px;">'
        + '<div style="font-weight:900; font-size:12px; color:#f59e0b; margin-bottom:4px;">🔒 PROFILE LOCKED</div>'
        + '<div style="font-size:12px; color:var(--muted-text); line-height:1.5;">To update your information, please contact an admin below.</div></div>';
    }

    html += '<div style="border-radius:12px; overflow:hidden; border:1px solid var(--ios-sep);">'
      + (admins || []).map((a, i, arr) => {
          const border = i < arr.length - 1 ? 'border-bottom:1px solid var(--ios-sep);' : '';
          const emailBtn = a.email ? '<a href="mailto:' + a.email + '" style="background:var(--icedogs-red); color:white; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; text-decoration:none;">Email</a>' : '';
          return '<div style="display:flex; align-items:center; gap:10px; padding:11px 14px; ' + border + '">'
            + '<div style="width:32px; height:32px; border-radius:50%; background:var(--icedogs-red); color:white; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;">' + a.name.charAt(0) + '</div>'
            + '<div style="flex:1;"><div style="font-weight:700; font-size:13px;">' + esc(a.name) + '</div>' + (a.email ? '<div style="font-size:11px; color:#888;">' + esc(a.email) + '</div>' : '') + '</div>'
            + emailBtn + '</div>';
        }).join('')

  async function loadSeason() {
    if (_seasonLoaded) return;
    _seasonLoaded = true;
    const cont = document.getElementById('seasonCont');
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted-text); font-size:13px;">Loading schedule...</div>';

    const { data: teams } = await sb.from('teams').select('name, logo_url');
    const logoMap = {};
    (teams || []).forEach(t => { if (t.name && t.logo_url) logoMap[t.name.toLowerCase()] = t.logo_url; });

    const { data: sched } = await sb.from('schedule').select('*').order('date');
    const games = sched || [];
    if (!games.length) {
      cont.innerHTML = '<div class="card"><div class="empty-state">No schedule synced yet.</div></div>';
      return;
    }

    let wins = 0, losses = 0, ties = 0;
    const enriched = games.map(g => {
      const hasScore = g.home_score !== null && g.away_score !== null;
      let result = null;
      if (hasScore) {
        const niagaraScore = g.is_home ? g.home_score : g.away_score;
        const oppScore = g.is_home ? g.away_score : g.home_score;
        result = niagaraScore > oppScore ? 'W' : (niagaraScore < oppScore ? 'L' : 'T');
        if (result === 'W') wins++; else if (result === 'L') losses++; else ties++;
      }
      const opponent = g.is_home ? g.away_team : g.home_team;
      return { ...g, hasScore, result, opponent };
    });

    const totalPlayed = wins + losses + ties;
    const recordStr = totalPlayed > 0 ? wins + '-' + losses + (ties > 0 ? '-' + ties : '') : 'Season not started';

    const monthMap = {}, monthOrder = [];
    enriched.forEach(g => {
      const key = new Date(g.date + "T12:00:00").toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      if (!monthMap[key]) { monthMap[key] = []; monthOrder.push(key); }
      monthMap[key].push(g);
    });

    let html = '<div class="card" style="padding:14px 16px; border:2px solid var(--icedogs-red); margin-bottom:12px; text-align:center;">'

      + '<div style="font-size:28px; font-weight:900;">' + recordStr + '</div>'
      + (totalPlayed > 0 ? '<div style="font-size:11px; color:var(--muted-text); margin-top:3px;">' + totalPlayed + ' game' + (totalPlayed !== 1 ? 's' : '') + ' played</div>' : '')
      + '</div>';

    monthOrder.forEach(monthKey => {
      const mGames = monthMap[monthKey];
      const monthId = 'season_' + monthKey.replace(/\s/g, '_');
      html += '<div class="card" style="padding:0; overflow:hidden; margin-bottom:10px;">'
        + '<div onclick="toggleSeasonMonth(\'' + monthId + '\')" style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#fafafa; border-bottom:1px solid var(--ios-sep); cursor:pointer;">'
        + '<span style="font-weight:900; font-size:13px; text-transform:uppercase;">' + monthKey + '</span>'
        + '<span id="' + monthId + '_chev" style="color:var(--muted-text); font-size:12px;">▼</span></div>'
        + '<div id="' + monthId + '" style="display:none;">'
        + mGames.map(g => {
            const dateLabel = new Date(g.date + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const logo = logoMap[(g.opponent || '').toLowerCase()] || '';
            const homeAway = g.is_home
              ? '<span style="font-size:9px; font-weight:900; background:var(--icedogs-red); color:white; padding:1px 5px; border-radius:3px; margin-left:4px;">HOME</span>'
              : '<span style="font-size:9px; font-weight:900; background:var(--ios-sep); color:var(--muted-text); padding:1px 5px; border-radius:3px; margin-left:4px;">AWAY</span>';
            const scoreHtml = g.hasScore
              ? '<div style="font-size:15px; font-weight:900;">' + (g.is_home ? g.home_score : g.away_score) + ' – ' + (g.is_home ? g.away_score : g.home_score) + '</div>'
              : '<div style="font-size:11px; font-weight:700; color:var(--muted-text);">' + (g.game_time || 'Upcoming') + '</div>';
            const badge = g.hasScore
              ? '<div class="result-badge result-' + g.result + '">' + g.result + '</div>'
              : '<div class="result-badge result-upcoming">—</div>';
            const logoHtml = logo
              ? '<img src="' + logo + '" style="width:32px; height:32px; object-fit:contain;">'
              : '<div style="width:32px; height:32px; border-radius:50%; background:var(--ios-sep); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900;">' + (g.opponent ? g.opponent.charAt(0) : '?') + '</div>';
            return '<div style="display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--ios-sep);">'
              + logoHtml

              + '<div style="font-size:11px; color:var(--muted-text); margin-top:1px;">' + dateLabel + '</div></div>'

  async function loadAvailGames() {
    const month = document.getElementById('availMonthSelect').value;

    const saveBtn = document.getElementById('availSaveBtn');
    document.getElementById('availMsg').style.display = 'none';

    cont.innerHTML = '<div style="padding:14px; text-align:center; color:var(--muted-text); font-size:12px;">Loading games...</div>';

      .from('games')
      .select('id, game_number, date, time, opponent_name')

    cont.innerHTML = currentMonthGames.map(g => {

      const dateLabel = new Date(g.date + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const reasonOpts = reasonOptions.map(r => '<option value="' + esc(r) + '"' + (saved && saved.reason === r ? ' selected' : '') + '>' + esc(r) + '</option>').join('');
      return '<div class="list-item" style="flex-direction:column; align-items:stretch;" data-game-id="' + g.id + '">'

        + '<select class="avail-status" style="width:140px; height:38px; margin:0;" onchange="toggleReasonVisibility(this)">'

        + '</select></div>'
        + '<select class="avail-reason" style="margin-top:8px; height:38px; display:' + (status === 'Not Available' ? 'block' : 'none') + ';"><option value="">-- Reason --</option>' + reasonOpts + '</select>'

  async function submitAvailability() {
    const month = document.getElementById('availMonthSelect').value;
    const rows = document.querySelectorAll('#availGameList .list-item');
    const results = [];
    rows.forEach(row => {
      const gameDbId = row.dataset.gameId;
      const game = currentMonthGames.find(g => g.id === gameDbId);
      if (!game) return;
      const status = row.querySelector('.avail-status').value;
      const reason = row.querySelector('.avail-reason').value;
      results.push({ gameId: game.game_number, status, reason });
    });

    const msgEl = document.getElementById('availMsg');
    msgEl.style.display = 'block';
    msgEl.style.color = 'var(--muted-text)';
    msgEl.textContent = 'Saving...';

    try {
      const res = await fetch(SAVE_AVAIL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ token: sessionToken, month, results })
      });
      const data = await res.json();
      if (data.success) {
        msgEl.style.color = '#166534';
        msgEl.textContent = '✓ Availability saved!';
      } else if (data.alreadySubmitted) {
        msgEl.style.color = '#991b1b';
        msgEl.textContent = 'Already submitted for this month.';
      } else {
        msgEl.style.color = '#C8102E';
        msgEl.textContent = data.msg || 'Save failed';
      }
    } catch (e) {
      msgEl.style.color = '#C8102E';
      msgEl.textContent = 'Network error — try again';
    }
  }

  function getLogoForTeam(teamName, logoMap) {
    if (!teamName || !logoMap) return "";
    const parts = teamName.toString().trim().split(' ');
    return logoMap[parts.slice(0,3).join(' ').toLowerCase()]
        || logoMap[parts.slice(0,2).join(' ').toLowerCase()]
        || logoMap[parts[0].toLowerCase()]
        || logoMap[parts[parts.length - 1].toLowerCase()]
        || logoMap[teamName.toString().trim().toLowerCase()]
        || "";

  async function loadLoginPageDataFromSupabase() {
    const { data: teams } = await sb.from('teams').select('name, logo_url');
    const logoMap = {};
    (teams || []).forEach(t => { if (t.name && t.logo_url) logoMap[t.name.toLowerCase()] = t.logo_url; });
    const mainLogo = logoMap['niagara'] || '';

    const todayStr = new Date().toISOString().slice(0, 10);
    const { data: games } = await sb
      .from('games')
      .select('id, game_number, date, time, opponent_name, schedule_locked')
      .gte('date', todayStr)
      .order('date', { ascending: true })
      .limit(5);

    const gameList = games || [];
    const gameIds = gameList.map(g => g.id);

    let rosterByGame = {};
    if (gameIds.length) {
      const { data: assignments } = await sb
        .from('assignments')
        .select('game_id, position, officials(name)')
        .in('game_id', gameIds);
      (assignments || []).forEach(a => {
        if (!a.officials || !a.officials.name) return;
        if (!rosterByGame[a.game_id]) rosterByGame[a.game_id] = [];
        rosterByGame[a.game_id].push({ position: a.position, name: a.officials.name });
      });
    }

    let availByGame = {};
    if (gameIds.length) {
      const { data: avail } = await sb
        .from('availability')
        .select('game_id, status, officials(name)')
        .in('game_id', gameIds)
        .eq('status', 'Available');
      (avail || []).forEach(a => {
        if (!a.officials || !a.officials.name) return;
        if (!availByGame[a.game_id]) availByGame[a.game_id] = [];
        availByGame[a.game_id].push(a.officials.name);
      });
    }

    const upcoming = gameList.map(g => {
      const dt = new Date(g.date + "T00:00:00");
      const timeMatch = (g.time || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
      if (timeMatch) {
        let h = parseInt(timeMatch[1], 10);
        const m = parseInt(timeMatch[2], 10);
        const ampm = (timeMatch[3] || "").toUpperCase();
        if (ampm === "PM" && h !== 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;
        dt.setHours(h, m, 0, 0);
      }
      return {
        gameId: g.game_number,
        logo: getLogoForTeam(g.opponent_name, logoMap),
        opponent: g.opponent_name,
        date: fmtDateLabel(g.date),
        time: g.time || "TBD",
        isoTimestamp: dt.getTime(),
        scheduleLocked: !!g.schedule_locked,
        roster: rosterByGame[g.id] || [],
        available: availByGame[g.id] || []
      };
    });

    const { data: officials } = await sb.from('officials').select('name').order('name');
    const officialNames = (officials || []).map(o => o.name);

    const nowIso = new Date().toISOString();
    const { data: broadcasts } = await sb
      .from('broadcasts')
      .select('message, type, sent_at, expires_at')
      .eq('active', true)
      .order('sent_at', { ascending: false });
    const activeBroadcasts = (broadcasts || [])
      .filter(b => !b.expires_at || b.expires_at >= nowIso)
      .map(b => ({ type: b.type, sentAt: new Date(b.sent_at).toLocaleDateString() }));

    return {
      dashboard: { mainLogo, upcoming },
      officials: officialNames,
      broadcasts: activeBroadcasts
    };
  }

    }).join('');
  }

  function renderPublicDashboard(data) {
    if (data.mainLogo) {
      document.getElementById("loginLogoCont").innerHTML = '<img src="' + data.mainLogo + '" class="main-portal-logo">';
    }
    const cont = document.getElementById("publicGamesList");
    if (!data.upcoming || data.upcoming.length === 0) { cont.innerHTML = '<div class="empty-state">No upcoming home games.</div>'; return; }
    const next = data.upcoming[0];
    const now  = new Date().getTime();
    const threeHours = 3 * 60 * 60 * 1000;
    const isInProgress = next.isoTimestamp <= now && now - next.isoTimestamp < threeHours;
    var timerHtml = isInProgress
      ? '<div id="timerCont"><div class="live-badge"><span>●</span> GAME IN PROGRESS</div></div>'
      : '<div id="timerCont"><div class="timer-header">NEXT GAME IN</div><div class="timer-grid"><div class="timer-slot"><div class="timer-val" id="t-days">00</div><div class="timer-label">Days</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-hrs">00</div><div class="timer-label">Hrs</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-min">00</div><div class="timer-label">Min</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-sec">00</div><div class="timer-label">Sec</div></div></div></div>';
    var html = timerHtml;
    data.upcoming.forEach(function(g) {
      var assignedHtml = g.roster && g.roster.length
        ? g.roster.map(function(r) { return '<div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f0f0f0;"><span style="font-size:11px; font-weight:700; color:#888; text-transform:uppercase;">' + r.position + '</span><span style="font-size:12px; font-weight:800;">' + r.name + '</span></div>'; }).join('')
        : '<div style="font-size:12px; color:var(--muted-text); font-style:italic; padding:8px 0;">No assignments yet.</div>';
      html += '<div class="list-item" style="flex-direction:column; align-items:stretch; padding:0;"><div style="display:flex; align-items:center; padding:12px 14px;"><img src="' + g.logo + '" class="team-logo" style="margin-right:12px;"><div style="flex:1;"><div style="font-weight:800; font-size:15px;">vs ' + esc(g.opponent) + '</div><div style="font-size:11px; color:var(--muted-text);">' + g.date + ' @ ' + g.time + '</div><div style="margin-top:5px;">' + (g.scheduleLocked ? '<span style="background:#dcfce7; border:1px solid #86efac; color:#166534; font-size:10px; font-weight:900; padding:3px 8px; border-radius:20px;">✓ Schedule Set</span>' : '<span style="background:#fff1f2; border:1px solid #fecaca; color:#991b1b; font-size:10px; font-weight:900; padding:3px 8px; border-radius:20px;">⏳ Scheduling In Progress</span>') + '</div></div></div><div style="padding:4px 14px 12px; border-top:1px solid var(--ios-sep);"><div style="font-size:10px; font-weight:900; color:#C8102E; margin-bottom:4px; padding-top:8px;">GAME #' + g.gameId + ' STAFF</div>' + assignedHtml + '</div></div>';
    });
    cont.innerHTML = html;
    startCountdown(next.isoTimestamp);
  }

  function startCountdown(targetTime) {
    if (countdownTimer) clearInterval(countdownTimer);
    const container = document.getElementById("timerCont");
    if (!container) return;
    function update() {
      const now  = new Date().getTime();
      const diff = targetTime - now;
      const threeHours = 3 * 60 * 60 * 1000;
      if (diff <= 0 && diff > -threeHours) { container.innerHTML = '<div class="live-badge"><span>●</span> GAME IN PROGRESS</div>'; return; }
      if (diff <= -threeHours) { clearInterval(countdownTimer); return; }
      const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
      const dEl = document.getElementById("t-days"), hEl = document.getElementById("t-hrs"), mEl = document.getElementById("t-min"), sEl = document.getElementById("t-sec");
      if (dEl) dEl.innerText = d.toString().padStart(2,'0');
      if (hEl) hEl.innerText = h.toString().padStart(2,'0');
      if (mEl) mEl.innerText = m.toString().padStart(2,'0');
      if (sEl) sEl.innerText = s.toString().padStart(2,'0');
    }
    update();
    countdownTimer = setInterval(update, 1000);
  }

  window.onload = function() {
    loadPinRequired();
    loadLoginPageDataFromSupabase()
      .then(function(d) {
        renderPublicDashboard(d.dashboard);
        var p = document.getElementById("userPicker");
        (d.officials || []).forEach(function(name) { p.innerHTML += '<option value="' + name + '">' + name + '</option>'; });
        renderLoginBroadcastNotice(d.broadcasts || []);
      })
      .catch(function(e) {
        var cont = document.getElementById("publicGamesList");
        if (cont) cont.innerHTML = '<div style="padding:14px; font-size:12px; color:#C8102E; font-weight:700;">Error loading games: ' + (e.message || e) + '</div>';
      });
  };
</script>
