<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>IceDogs Portal — Supabase Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --icedogs-red: #C8102E; --icedogs-black: #000000; --ios-bg: #F8F8F8;
    --ios-card: #FFFFFF; --ios-green: #34C759; --ios-sep: #E5E5E5; --ios-text: #1C1C1E;
    --std-logo-size: 40px; --muted-text: #888;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background-color: var(--ios-bg); color: var(--ios-text); margin: 0; padding: 0; }
  .main-container { padding: 16px; max-width: 450px; margin: 0 auto; }
  .card { background: var(--ios-card); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--ios-sep); }
  .team-logo { width: var(--std-logo-size); height: var(--std-logo-size); object-fit: contain; flex-shrink: 0; }
  .main-portal-logo { width: 70px; height: auto; display: block; margin: 0 auto 15px auto; }
  .btn-primary { background: var(--icedogs-red); color: white; border: none; width: 100%; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  input, select { width: 100%; height: 52px; background: white; border: 2px solid var(--ios-sep); padding: 0 16px; border-radius: 12px; font-size: 16px; margin-bottom: 12px; font-family: inherit; }
  .empty-state { padding: 30px; text-align: center; color: #888; font-style: italic; font-size: 14px; background: #fdfdfd; }
  #timerCont { background: var(--ios-card); border: 1px solid var(--ios-sep); border-radius: 8px; padding: 8px; margin: 15px; text-align: center; }
  .timer-header { font-weight: 900; font-size: 9px; color: var(--icedogs-red); margin-bottom: 4px; letter-spacing: 0.5px; }
  .timer-grid { display: flex; justify-content: center; align-items: center; gap: 4px; }
  .timer-slot { display: flex; flex-direction: column; align-items: center; min-width: 35px; }
  .timer-val { font-size: 18px; font-weight: 900; color: var(--ios-text); line-height: 1; }
  .timer-sep { font-size: 16px; font-weight: 900; color: var(--ios-sep); }
  .timer-label { font-size: 7px; font-weight: 800; color: var(--muted-text); text-transform: uppercase; margin-top: 2px; }
  .live-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--icedogs-red); color: white; font-size: 11px; font-weight: 900; padding: 6px 12px; border-radius: 20px; }
  .list-item { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--ios-sep); }
</style>
</head>
<body>

<div class="main-container" id="mainContainer">
  <div id="userStatusBar" style="display:none; background:#000; color:white; padding:12px 16px; border-radius:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
    <div>🏒 <span id="barUserName"></span></div>
    <button onclick="signOut()" style="background:none; border:1px solid #444; border-radius:20px; color:#ccc; font-size:10px; font-weight:800; padding:4px 10px; cursor:pointer;">Sign Out</button>
  </div>

  <div id="loginSection">
    <div class="card">
      <div id="loginLogoCont"></div>
      <div style="font-size:18px; font-weight:900; margin-bottom:20px; text-align:center; text-transform:uppercase;">Off-Ice Officials Portal</div>
      <select id="userPicker" onchange="handleUserSelect()"><option value="">Select Your Name...</option></select>
      <div id="pinArea" style="display:none; margin-top:10px;">
        <input type="password" id="userPin" placeholder="PIN" inputmode="numeric" maxlength="4" style="text-align:center;">
        <button id="loginBtn" class="btn-primary" onclick="attemptLogin()">Login</button>
      </div>
      <div id="loginError" style="display:none; color:#C8102E; font-size:12px; font-weight:700; text-align:center; margin-top:8px;"></div>
    </div>
    <div id="loginBroadcastNotice" style="display:none;"></div>
    <div class="card" style="border-top:4px solid var(--icedogs-red); padding:0; overflow:hidden;">
      <div style="font-weight:900; font-size:14px; padding:15px; text-align:center; border-bottom:1px solid var(--ios-sep);">UPCOMING HOME GAMES</div>
      <div id="publicGamesList"></div>
    </div>
  </div>

  <div id="appSection" style="display:none;">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:15px; font-weight:900;" id="appUserName"></div>
        <div style="font-size:11px; color:var(--muted-text);">Role: <span id="appUserRole"></span></div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="tabBtnAvail" onclick="switchAppTab('avail')" style="flex:1; height:40px; border:none; border-radius:10px; background:var(--icedogs-red); color:white; font-weight:800; font-size:11px; cursor:pointer; text-transform:uppercase;">Avail</button>
      <button id="tabBtnMyGames" onclick="switchAppTab('myGames')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:11px; cursor:pointer; text-transform:uppercase;">My Games</button>
      <button id="tabBtnCrew" onclick="switchAppTab('crew')" style="flex:1; height:40px; border:none; border-radius:10px; background:#e5e5e5; color:#555; font-weight:800; font-size:11px; cursor:pointer; text-transform:uppercase;">Crew</button>
    </div>

    <div id="appTabCrew" style="display:none;">
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="font-weight:900; font-size:14px; padding:15px; border-bottom:1px solid var(--ios-sep);">CREW ASSIGNMENTS</div>
        <div id="crewList"></div>
      </div>
    </div>

    <div id="appTabAvail">
      <div class="card">
        <div style="font-weight:900; font-size:14px; margin-bottom:12px;">AVAILABILITY</div>
        <select id="availMonthSelect" onchange="loadAvailGames()"><option value="">Select Month...</option></select>
        <div id="availGameList"></div>
        <button id="availSaveBtn" class="btn-primary" style="display:none; margin-top:16px;" onclick="submitAvailability()">Submit Schedule</button>
        <div id="availMsg" style="display:none; font-size:12px; font-weight:700; text-align:center; margin-top:10px;"></div>
      </div>
    </div>

    <div id="appTabMyGames" style="display:none;">
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="font-weight:900; font-size:14px; padding:15px; border-bottom:1px solid var(--ios-sep);">MY GAMES</div>
        <div id="myGamesList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- Supabase config ----
  const SUPABASE_URL = "https://fcehtovermlilpvwcksl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZWh0b3Zlcm1saWxwdndja3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTQzMDQsImV4cCI6MjEwMTQzMDMwNH0.Gllg9p2j3Bxrv1bpyNFBQMQtYQfWXDcxF9H7njyBksU";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let countdownTimer;

  const LOGIN_FUNCTION_URL = "https://fcehtovermlilpvwcksl.supabase.co/functions/v1/login";
  let pinRequired = false;
  let sessionToken = null;
  let sessionOfficial = null;

  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearLoginError() {
    document.getElementById('loginError').style.display = 'none';
  }

  function handleUserSelect() {
    clearLoginError();
    const user = document.getElementById("userPicker").value;
    document.getElementById("pinArea").style.display = "none";
    if (!user) return;
    if (pinRequired) {
      document.getElementById("pinArea").style.display = "block";
    } else {
      performLogin(user, null);
    }
  }

  function attemptLogin() {
    const user = document.getElementById("userPicker").value;
    const pin = document.getElementById("userPin").value;
    performLogin(user, pin);
  }

  async function performLogin(name, pin) {
    clearLoginError();
    try {
      const res = await fetch(LOGIN_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ name, pin })
      });
      const data = await res.json();
      if (!data.success) {
        showLoginError(data.msg || "Login failed");
        return;
      }
      sessionToken = data.token;
      sessionOfficial = data.official;
      loginSuccess();
    } catch (e) {
      showLoginError("Network error — try again");
    }
  }

  function loginSuccess() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    document.getElementById("userStatusBar").style.display = "flex";
    document.getElementById("barUserName").textContent = sessionOfficial.name;
    document.getElementById("appUserName").textContent = sessionOfficial.name;
    document.getElementById("appUserRole").textContent = sessionOfficial.role;
    loadAvailMonths();
  }

  function switchAppTab(tab) {
    document.getElementById('appTabAvail').style.display = tab === 'avail' ? 'block' : 'none';
    document.getElementById('appTabMyGames').style.display = tab === 'myGames' ? 'block' : 'none';
    document.getElementById('appTabCrew').style.display = tab === 'crew' ? 'block' : 'none';
    ['Avail', 'MyGames', 'Crew'].forEach(t => {
      const btn = document.getElementById('tabBtn' + t);
      const active = (t === 'Avail' && tab === 'avail') || (t === 'MyGames' && tab === 'myGames') || (t === 'Crew' && tab === 'crew');
      btn.style.background = active ? 'var(--icedogs-red)' : '#e5e5e5';
      btn.style.color = active ? 'white' : '#555';
    });
    if (tab === 'myGames') loadMyGames();
    if (tab === 'crew') loadCrew();
  }

  async function loadCrew() {
    const cont = document.getElementById('crewList');
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted-text); font-size:13px;">Loading...</div>';

    const todayStr = new Date().toISOString().slice(0, 10);
    const { data: games } = await sb
      .from('games')
      .select('id, game_number, date, time, opponent_name')
      .gte('date', todayStr)
      .order('date')
      .limit(10);

    const gameList = games || [];
    if (!gameList.length) { cont.innerHTML = '<div class="empty-state">No upcoming games.</div>'; return; }

    const gameIds = gameList.map(g => g.id);
    const { data: assignments } = await sb
      .from('assignments')
      .select('game_id, position, officials(name)')
      .in('game_id', gameIds);
    const { data: avail } = await sb
      .from('availability')
      .select('game_id, status, officials(name)')
      .in('game_id', gameIds)
      .eq('status', 'Available');

    const rosterByGame = {};
    (assignments || []).forEach(a => {
      if (!a.officials) return;
      if (!rosterByGame[a.game_id]) rosterByGame[a.game_id] = [];
      rosterByGame[a.game_id].push({ position: a.position, name: a.officials.name });
    });
    const availByGame = {};
    (avail || []).forEach(a => {
      if (!a.officials) return;
      if (!availByGame[a.game_id]) availByGame[a.game_id] = [];
      availByGame[a.game_id].push(a.officials.name);
    });

    cont.innerHTML = gameList.map(g => {
      const dateLabel = new Date(g.date + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const roster = rosterByGame[g.id] || [];
      const assignedNames = new Set(roster.map(r => r.name));
      const unscheduled = (availByGame[g.id] || []).filter(n => !assignedNames.has(n));

      const crewRows = roster.length
        ? roster.map(r => '<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--ios-sep);"><span style="font-size:10px; font-weight:900; color:var(--muted-text); text-transform:uppercase;">' + esc(r.position) + '</span><span style="font-size:12px; font-weight:700;">' + esc(r.name) + (r.name === sessionOfficial.name ? ' ★' : '') + '</span></div>').join('')
        : '<div style="font-size:12px; color:var(--muted-text); font-style:italic; padding:6px 0;">No assignments yet.</div>';

      const availChips = unscheduled.length
        ? '<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--ios-sep);"><div style="font-size:10px; font-weight:900; color:var(--muted-text); text-transform:uppercase; margin-bottom:6px;">Available · Not Scheduled</div><div style="display:flex; flex-wrap:wrap; gap:5px;">'
          + unscheduled.map(n => '<span style="background:#f0fdf4; border:1px solid #86efac; color:#166534; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;">' + esc(n) + (n === sessionOfficial.name ? ' ★' : '') + '</span>').join('')
          + '</div></div>'
        : '';

      return '<div style="border-bottom:1px solid var(--ios-sep); padding:12px 14px;">'
        + '<div style="font-weight:800; font-size:13px;">vs ' + esc(g.opponent_name) + '</div>'
        + '<div style="font-size:11px; color:var(--muted-text); margin-bottom:8px;">' + dateLabel + ' @ ' + (g.time || 'TBD') + '</div>'
        + crewRows + availChips
        + '</div>';
    }).join('');
  }

  async function loadMyGames() {
    const cont = document.getElementById('myGamesList');
    cont.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted-text); font-size:13px;">Loading...</div>';

    const { data: assignments } = await sb
      .from('assignments')
      .select('position, games(id, game_number, date, time, opponent_name)')
      .eq('official_id', sessionOfficial.id);

    const rows = (assignments || [])
      .filter(a => a.games)
      .map(a => ({ position: a.position, date: a.games.date, time: a.games.time, opponent: a.games.opponent_name, gameNumber: a.games.game_number }))
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    if (!rows.length) {
      cont.innerHTML = '<div class="empty-state">No games assigned yet.</div>';
      return;
    }

    const todayStr = new Date().toISOString().slice(0, 10);
    const upcoming = rows.filter(r => r.date >= todayStr);
    const past = rows.filter(r => r.date < todayStr);

    function rowHtml(r, isPast) {
      const dateLabel = new Date(r.date + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      return '<div class="list-item"' + (isPast ? ' style="opacity:0.7;"' : '') + '>'
        + '<div style="flex:1;"><div style="font-weight:700; font-size:13px;">' + (isPast ? '' : '') + 'vs ' + esc(r.opponent) + '</div>'
        + '<div style="font-size:11px; color:var(--muted-text);">' + dateLabel + ' @ ' + (r.time || 'TBD') + '</div></div>'
        + '<span style="background:var(--icedogs-red); color:white; font-size:10px; font-weight:900; padding:4px 10px; border-radius:20px; white-space:nowrap;">' + esc(r.position) + '</span>'
        + '</div>';
    }

    let html = '';
    if (upcoming.length) {
      html += upcoming.map(r => rowHtml(r, false)).join('');
    } else {
      html += '<div class="empty-state">No upcoming games.</div>';
    }
    if (past.length) {
      html += '<div style="padding:10px 15px; font-size:11px; font-weight:900; color:var(--muted-text); text-transform:uppercase; border-top:1px solid var(--ios-sep); border-bottom:1px solid var(--ios-sep); background:#fafafa;">Past Games</div>';
      html += past.map(r => rowHtml(r, true)).join('');
    }
    cont.innerHTML = html;
  }
  const SAVE_AVAIL_URL = "https://fcehtovermlilpvwcksl.supabase.co/functions/v1/save-availability";
  let reasonOptions = [];
  let currentMonthGames = [];

  async function loadAvailMonths() {
    const { data: months } = await sb.from('month_windows').select('month, status').eq('status', 'Active').order('month');
    const { data: reasons } = await sb.from('reasons').select('label').order('sort_order');
    reasonOptions = (reasons || []).map(r => r.label);

    const sel = document.getElementById('availMonthSelect');
    sel.innerHTML = '<option value="">Select Month...</option>';
    (months || []).forEach(m => {
      const label = new Date(m.month + "T12:00:00").toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      sel.innerHTML += '<option value="' + m.month + '">' + label + '</option>';
    });
  }

  async function loadAvailGames() {
    const month = document.getElementById('availMonthSelect').value;
    const cont = document.getElementById('availGameList');
    const saveBtn = document.getElementById('availSaveBtn');
    document.getElementById('availMsg').style.display = 'none';
    if (!month) { cont.innerHTML = ''; saveBtn.style.display = 'none'; return; }

    cont.innerHTML = '<div style="padding:14px; text-align:center; color:var(--muted-text); font-size:12px;">Loading games...</div>';

    const nextMonth = new Date(month + "T00:00:00");
    nextMonth.setMonth(nextMonth.getMonth() + 1);
    const nextMonthStr = nextMonth.toISOString().slice(0, 10);

    const { data: games } = await sb
      .from('games')
      .select('id, game_number, date, time, opponent_name')
      .gte('date', month)
      .lt('date', nextMonthStr)
      .order('date');

    const { data: existing } = await sb
      .from('availability')
      .select('game_id, status, reason')
      .eq('official_id', sessionOfficial.id);
    const existingMap = {};
    (existing || []).forEach(e => { existingMap[e.game_id] = e; });

    currentMonthGames = games || [];

    if (!currentMonthGames.length) {
      cont.innerHTML = '<div class="empty-state">No games scheduled this month.</div>';
      saveBtn.style.display = 'none';
      return;
    }

    cont.innerHTML = currentMonthGames.map(g => {
      const saved = existingMap[g.id];
      const status = saved ? saved.status : 'Available';
      const dateLabel = new Date(g.date + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const reasonOpts = reasonOptions.map(r => '<option value="' + esc(r) + '"' + (saved && saved.reason === r ? ' selected' : '') + '>' + esc(r) + '</option>').join('');
      return '<div class="list-item" style="flex-direction:column; align-items:stretch;" data-game-id="' + g.id + '">'
        + '<div style="display:flex; justify-content:space-between; align-items:center; width:100%;">'
        + '<div><div style="font-weight:700; font-size:13px;">vs ' + esc(g.opponent_name) + '</div><div style="font-size:11px; color:var(--muted-text);">' + dateLabel + ' @ ' + (g.time || 'TBD') + '</div></div>'
        + '<select class="avail-status" style="width:140px; height:38px; margin:0;" onchange="toggleReasonVisibility(this)">'
        + '<option value="Available"' + (status === 'Available' ? ' selected' : '') + '>Available</option>'
        + '<option value="Not Available"' + (status === 'Not Available' ? ' selected' : '') + '>Not Available</option>'
        + '</select></div>'
        + '<select class="avail-reason" style="margin-top:8px; height:38px; display:' + (status === 'Not Available' ? 'block' : 'none') + ';"><option value="">-- Reason --</option>' + reasonOpts + '</select>'
        + '</div>';
    }).join('');

    saveBtn.style.display = 'block';
  }

  function toggleReasonVisibility(sel) {
    const row = sel.closest('.list-item');
    const reasonSel = row.querySelector('.avail-reason');
    reasonSel.style.display = sel.value === 'Not Available' ? 'block' : 'none';
  }

  async function submitAvailability() {
    const month = document.getElementById('availMonthSelect').value;
    const rows = document.querySelectorAll('#availGameList .list-item');
    const results = [];
    rows.forEach(row => {
      const gameDbId = row.dataset.gameId;
      const game = currentMonthGames.find(g => g.id === gameDbId);
      if (!game) return;
      const status = row.querySelector('.avail-status').value;
      const reason = row.querySelector('.avail-reason').value;
      results.push({ gameId: game.game_number, status, reason });
    });

    const msgEl = document.getElementById('availMsg');
    msgEl.style.display = 'block';
    msgEl.style.color = 'var(--muted-text)';
    msgEl.textContent = 'Saving...';

    try {
      const res = await fetch(SAVE_AVAIL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ token: sessionToken, month, results })
      });
      const data = await res.json();
      if (data.success) {
        msgEl.style.color = '#166534';
        msgEl.textContent = '✓ Availability saved!';
      } else if (data.alreadySubmitted) {
        msgEl.style.color = '#991b1b';
        msgEl.textContent = 'Already submitted for this month.';
      } else {
        msgEl.style.color = '#C8102E';
        msgEl.textContent = data.msg || 'Save failed';
      }
    } catch (e) {
      msgEl.style.color = '#C8102E';
      msgEl.textContent = 'Network error — try again';
    }
  }

  function signOut() {
    sessionToken = null;
    sessionOfficial = null;
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("appSection").style.display = "none";
    document.getElementById("userStatusBar").style.display = "none";
    document.getElementById("userPicker").value = "";
    document.getElementById("pinArea").style.display = "none";
    document.getElementById("userPin").value = "";
  }

  async function loadPinRequired() {
    const { data } = await sb.from('app_settings').select('value').eq('key', 'pin_required').maybeSingle();
    pinRequired = data && data.value === 'ON';
  }

  function esc(str) {
    return (str || '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function getLogoForTeam(teamName, logoMap) {
    if (!teamName || !logoMap) return "";
    const parts = teamName.toString().trim().split(' ');
    return logoMap[parts.slice(0,3).join(' ').toLowerCase()]
        || logoMap[parts.slice(0,2).join(' ').toLowerCase()]
        || logoMap[parts[0].toLowerCase()]
        || logoMap[parts[parts.length - 1].toLowerCase()]
        || logoMap[teamName.toString().trim().toLowerCase()]
        || "";
  }

  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + "T12:00:00");
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }

  async function loadLoginPageDataFromSupabase() {
    const { data: teams } = await sb.from('teams').select('name, logo_url');
    const logoMap = {};
    (teams || []).forEach(t => { if (t.name && t.logo_url) logoMap[t.name.toLowerCase()] = t.logo_url; });
    const mainLogo = logoMap['niagara'] || '';

    const todayStr = new Date().toISOString().slice(0, 10);
    const { data: games } = await sb
      .from('games')
      .select('id, game_number, date, time, opponent_name, schedule_locked')
      .gte('date', todayStr)
      .order('date', { ascending: true })
      .limit(5);

    const gameList = games || [];
    const gameIds = gameList.map(g => g.id);

    let rosterByGame = {};
    if (gameIds.length) {
      const { data: assignments } = await sb
        .from('assignments')
        .select('game_id, position, officials(name)')
        .in('game_id', gameIds);
      (assignments || []).forEach(a => {
        if (!a.officials || !a.officials.name) return;
        if (!rosterByGame[a.game_id]) rosterByGame[a.game_id] = [];
        rosterByGame[a.game_id].push({ position: a.position, name: a.officials.name });
      });
    }

    let availByGame = {};
    if (gameIds.length) {
      const { data: avail } = await sb
        .from('availability')
        .select('game_id, status, officials(name)')
        .in('game_id', gameIds)
        .eq('status', 'Available');
      (avail || []).forEach(a => {
        if (!a.officials || !a.officials.name) return;
        if (!availByGame[a.game_id]) availByGame[a.game_id] = [];
        availByGame[a.game_id].push(a.officials.name);
      });
    }

    const upcoming = gameList.map(g => {
      const dt = new Date(g.date + "T00:00:00");
      const timeMatch = (g.time || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
      if (timeMatch) {
        let h = parseInt(timeMatch[1], 10);
        const m = parseInt(timeMatch[2], 10);
        const ampm = (timeMatch[3] || "").toUpperCase();
        if (ampm === "PM" && h !== 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;
        dt.setHours(h, m, 0, 0);
      }
      return {
        gameId: g.game_number,
        logo: getLogoForTeam(g.opponent_name, logoMap),
        opponent: g.opponent_name,
        date: fmtDateLabel(g.date),
        time: g.time || "TBD",
        isoTimestamp: dt.getTime(),
        scheduleLocked: !!g.schedule_locked,
        roster: rosterByGame[g.id] || [],
        available: availByGame[g.id] || []
      };
    });

    const { data: officials } = await sb.from('officials').select('name').order('name');
    const officialNames = (officials || []).map(o => o.name);

    const nowIso = new Date().toISOString();
    const { data: broadcasts } = await sb
      .from('broadcasts')
      .select('message, type, sent_at, expires_at')
      .eq('active', true)
      .order('sent_at', { ascending: false });
    const activeBroadcasts = (broadcasts || [])
      .filter(b => !b.expires_at || b.expires_at >= nowIso)
      .map(b => ({ type: b.type, sentAt: new Date(b.sent_at).toLocaleDateString() }));

    return {
      dashboard: { mainLogo, upcoming },
      officials: officialNames,
      broadcasts: activeBroadcasts
    };
  }

  function renderLoginBroadcastNotice(broadcasts) {
    const cont = document.getElementById('loginBroadcastNotice');
    if (!cont) return;
    if (!broadcasts || broadcasts.length === 0) { cont.style.display = 'none'; return; }
    const TYPE_CFG = {
      urgent:   { icon: '🚨', label: 'URGENT',   color: '#C8102E', bg: 'rgba(200,16,46,0.08)',   border: 'rgba(200,16,46,0.3)'   },
      reminder: { icon: '⏰', label: 'REMINDER', color: '#b45309', bg: 'rgba(180,83,9,0.08)',    border: 'rgba(180,83,9,0.3)'    },
      info:     { icon: 'ℹ️', label: 'NOTICE',   color: '#1d4ed8', bg: 'rgba(29,78,216,0.08)',   border: 'rgba(29,78,216,0.3)'   }
    };
    cont.style.display = 'block';
    cont.innerHTML = broadcasts.map(function(b) {
      const cfg = TYPE_CFG[b.type] || TYPE_CFG.info;
      return '<div style="background:' + cfg.bg + '; border:1px solid ' + cfg.border + '; border-radius:12px; padding:11px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;">'
        + '<span style="font-size:18px; flex-shrink:0;">' + cfg.icon + '</span>'
        + '<div style="flex:1; min-width:0;"><div style="font-size:11px; font-weight:900; color:' + cfg.color + '; text-transform:uppercase;">' + cfg.label + ' — Portal Notice</div>'
        + '<div style="font-size:11px; color:var(--muted-text); margin-top:2px;">Posted ' + esc(b.sentAt) + ' — Sign in to view</div></div></div>';
    }).join('');
  }

  function renderPublicDashboard(data) {
    if (data.mainLogo) {
      document.getElementById("loginLogoCont").innerHTML = '<img src="' + data.mainLogo + '" class="main-portal-logo">';
    }
    const cont = document.getElementById("publicGamesList");
    if (!data.upcoming || data.upcoming.length === 0) { cont.innerHTML = '<div class="empty-state">No upcoming home games.</div>'; return; }
    const next = data.upcoming[0];
    const now  = new Date().getTime();
    const threeHours = 3 * 60 * 60 * 1000;
    const isInProgress = next.isoTimestamp <= now && now - next.isoTimestamp < threeHours;
    var timerHtml = isInProgress
      ? '<div id="timerCont"><div class="live-badge"><span>●</span> GAME IN PROGRESS</div></div>'
      : '<div id="timerCont"><div class="timer-header">NEXT GAME IN</div><div class="timer-grid"><div class="timer-slot"><div class="timer-val" id="t-days">00</div><div class="timer-label">Days</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-hrs">00</div><div class="timer-label">Hrs</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-min">00</div><div class="timer-label">Min</div></div><div class="timer-sep">:</div><div class="timer-slot"><div class="timer-val" id="t-sec">00</div><div class="timer-label">Sec</div></div></div></div>';
    var html = timerHtml;
    data.upcoming.forEach(function(g) {
      var assignedHtml = g.roster && g.roster.length
        ? g.roster.map(function(r) { return '<div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f0f0f0;"><span style="font-size:11px; font-weight:700; color:#888; text-transform:uppercase;">' + r.position + '</span><span style="font-size:12px; font-weight:800;">' + r.name + '</span></div>'; }).join('')
        : '<div style="font-size:12px; color:var(--muted-text); font-style:italic; padding:8px 0;">No assignments yet.</div>';
      html += '<div class="list-item" style="flex-direction:column; align-items:stretch; padding:0;"><div style="display:flex; align-items:center; padding:12px 14px;"><img src="' + g.logo + '" class="team-logo" style="margin-right:12px;"><div style="flex:1;"><div style="font-weight:800; font-size:15px;">vs ' + esc(g.opponent) + '</div><div style="font-size:11px; color:var(--muted-text);">' + g.date + ' @ ' + g.time + '</div><div style="margin-top:5px;">' + (g.scheduleLocked ? '<span style="background:#dcfce7; border:1px solid #86efac; color:#166534; font-size:10px; font-weight:900; padding:3px 8px; border-radius:20px;">✓ Schedule Set</span>' : '<span style="background:#fff1f2; border:1px solid #fecaca; color:#991b1b; font-size:10px; font-weight:900; padding:3px 8px; border-radius:20px;">⏳ Scheduling In Progress</span>') + '</div></div></div><div style="padding:4px 14px 12px; border-top:1px solid var(--ios-sep);"><div style="font-size:10px; font-weight:900; color:#C8102E; margin-bottom:4px; padding-top:8px;">GAME #' + g.gameId + ' STAFF</div>' + assignedHtml + '</div></div>';
    });
    cont.innerHTML = html;
    startCountdown(next.isoTimestamp);
  }

  function startCountdown(targetTime) {
    if (countdownTimer) clearInterval(countdownTimer);
    const container = document.getElementById("timerCont");
    if (!container) return;
    function update() {
      const now  = new Date().getTime();
      const diff = targetTime - now;
      const threeHours = 3 * 60 * 60 * 1000;
      if (diff <= 0 && diff > -threeHours) { container.innerHTML = '<div class="live-badge"><span>●</span> GAME IN PROGRESS</div>'; return; }
      if (diff <= -threeHours) { clearInterval(countdownTimer); return; }
      const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
      const dEl = document.getElementById("t-days"), hEl = document.getElementById("t-hrs"), mEl = document.getElementById("t-min"), sEl = document.getElementById("t-sec");
      if (dEl) dEl.innerText = d.toString().padStart(2,'0');
      if (hEl) hEl.innerText = h.toString().padStart(2,'0');
      if (mEl) mEl.innerText = m.toString().padStart(2,'0');
      if (sEl) sEl.innerText = s.toString().padStart(2,'0');
    }
    update();
    countdownTimer = setInterval(update, 1000);
  }

  window.onload = function() {
    loadPinRequired();
    loadLoginPageDataFromSupabase()
      .then(function(d) {
        renderPublicDashboard(d.dashboard);
        var p = document.getElementById("userPicker");
        (d.officials || []).forEach(function(name) { p.innerHTML += '<option value="' + name + '">' + name + '</option>'; });
        renderLoginBroadcastNotice(d.broadcasts || []);
      })
      .catch(function(e) {
        var cont = document.getElementById("publicGamesList");
        if (cont) cont.innerHTML = '<div style="padding:14px; font-size:12px; color:#C8102E; font-weight:700;">Error loading games: ' + (e.message || e) + '</div>';
      });
  };
</script>
